<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'">
  <title>ContextDeck</title>
  <link rel="stylesheet" href="./app.bundle.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" data-mode="terminal">
    <header class="topbar">
      <div class="brand">ContextDeck</div>
      <div class="segmented" role="tablist" aria-label="Views">
        <button id="tab-terminal" class="segment" role="tab" aria-selected="true" type="button">Terminal</button>
        <button id="tab-chat" class="segment" role="tab" aria-selected="false" type="button">ChatGPT</button>
      </div>
      <div class="ws">
        <span id="ws-label" class="ws-label">Workspace</span>
        <button id="ws-trigger" class="control select" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-disabled="true" aria-labelledby="ws-label ws-trigger-text">
          <span id="ws-trigger-text" class="select-text is-placeholder">Herdr desconectado</span>
          <span id="ws-activity" class="ws-activity" hidden></span>
          <span class="select-caret" aria-hidden="true"></span>
        </button>
        <button id="ws-mode" class="toggle" type="button" aria-pressed="true" disabled>Auto</button>
      </div>
      <div class="view-actions">
        <div class="actions terminal-only">
          <button id="reconnect-terminal" class="btn" type="button">Reconectar Herdr</button>
          <button id="herdr-diag" class="btn" type="button" aria-expanded="false" aria-controls="herdr-panel" title="Diagn&oacute;stico (somente leitura) dos workspaces do Herdr">Workspaces</button>
        </div>
        <div class="actions chat-only">
          <button id="chat-home" class="btn" type="button">In&iacute;cio GPT</button>
          <button id="reload-chat" class="btn" type="button">Recarregar</button>
          <button id="external-chat" class="btn" type="button">Abrir no navegador</button>
        </div>
      </div>
      <button id="chat-link" class="unlinked chat-link chat-only" type="button" aria-haspopup="dialog" aria-expanded="false" title="Vínculos entre esta conversa e os workspaces do Herdr">Vínculo: &hellip;</button>
    </header>
    <nav id="chatbar" class="chatbar chat-only" aria-label="Conversas do workspace">
      <span id="chatbar-ws" class="chatbar-ws">ChatGPT</span>
      <div id="chatbar-tabs" class="chatbar-tabs" role="tablist" aria-label="Conversas"></div>
      <button id="chatbar-new" class="btn btn-icon" type="button" aria-label="Nova conversa" title="Nova conversa">+</button>
      <button id="chatbar-manage" class="btn" type="button" aria-haspopup="dialog" title="Vincular, renomear e reassociar conversas">Gerenciar</button>
    </nav>
    <main class="content">
      <div id="terminal-root" aria-label="Terminal Herdr"></div>
      <section id="chat-empty" class="chat-empty chat-only" aria-live="polite" hidden>
        <h2 id="chat-empty-title" class="chat-empty-title"></h2>
        <p id="chat-empty-text" class="chat-empty-text"></p>
        <div class="actions">
          <button id="chat-empty-new" class="btn" type="button">Nova conversa</button>
          <button id="chat-empty-manage" class="btn" type="button" aria-haspopup="dialog">Vincular conversa&hellip;</button>
        </div>
      </section>
      <section id="herdr-panel" class="diag-panel" tabindex="-1" aria-label="Diagn&oacute;stico dos workspaces do Herdr" hidden>
        <header class="diag-title"><strong>Workspaces do Herdr</strong><span class="diag-ro">somente leitura</span><span class="spacer"></span><button id="herdr-panel-refresh" class="btn" type="button">Atualizar</button><button id="herdr-panel-close" class="btn" type="button" aria-label="Fechar">&times;</button></header>
        <div id="herdr-panel-body"></div>
      </section>
    </main>
    <footer class="footer" id="footer">
      <div class="footer-row">
        <div class="git-repo" id="git-repo" title="">Git: &hellip;</div>
        <button id="git-pick" class="btn" type="button" title="Escolher a pasta do reposit&oacute;rio">Repo&hellip;</button>
        <button id="git-refresh" class="btn btn-icon" type="button" title="Atualizar refer&ecirc;ncias (n&atilde;o faz fetch)" aria-label="Atualizar refer&ecirc;ncias">&#8635;</button>
        <div class="field"><span>Base diff</span><button id="base-btn" class="control select select-fit" type="button" aria-haspopup="listbox" aria-expanded="false"></button></div>
        <div class="field"><span>Revis&atilde;o</span><button id="rev-btn" class="control select select-fit" type="button" aria-haspopup="listbox" aria-expanded="false"></button><span id="rev-resolved" class="resolved"></span></div>
        <div class="actions">
          <button id="git-diff" class="btn" type="button" title="git diff &lt;base&gt; (somente arquivos rastreados)">Copiar Diff</button>
          <button id="git-show" class="btn" type="button" title="git show &lt;revis&atilde;o&gt;">Copiar Git Show</button>
          <button id="git-zip" class="btn" type="button" title="git archive &lt;revis&atilde;o&gt; &rarr; ZIP copiado como arquivo">Gerar + Copiar ZIP</button>
          <button id="git-zip-delete" class="btn btn-danger" type="button" disabled>Excluir ZIP</button>
        </div>
      </div>
      <div class="picker-panel" id="picker-panel" hidden>
        <input id="picker-search" class="control" type="text" role="combobox" aria-controls="picker-list" aria-expanded="true" aria-autocomplete="list" placeholder="Buscar branch, tag ou commit; ou digite HEAD~2 / SHA e Enter" maxlength="200" spellcheck="false" autocomplete="off">
        <ul id="picker-list" class="menu" role="listbox"></ul>
      </div>
      <div class="hint" id="git-hint" role="alert" hidden></div>
      <div class="status" id="status" role="status" data-level="info">Ctrl+Tab para alternar</div>
    </footer>
  </div>
  <script src="./app.bundle.js"></script>
</body>
</html>
